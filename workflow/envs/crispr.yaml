# Python/MAGeCK/Java environment for RSL counting, SSMD plotting, MAGeCK pathway
# and the helper scripts. Versions taken from the environment used for the paper
# run (crispr_pipeline "cisregvar" env, built 2025-05); pytorch was dropped (unused).
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11.12
  - numpy=2.2.6
  - pandas=2.2.3
  - scipy=1.15.2
  - scikit-learn=1.6.1
  - statsmodels=0.14.4
  - matplotlib=3.10.3
  - seaborn=0.13.2
  - tqdm=4.67.1
  - mageck=0.5.9.5
  - openjdk=17      # runs CrisprCounter.jar (not on conda, see README)
  - perl=5.32
